app = "your-fcgbds-app"
primary_region = "iad"

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "2s"
    method = "GET"

[env]
  FCGBDS_MODE = "observe"
  FCGBDS_STORE = "sqlite"
  FCGBDS_SQLITE_PATH = "/data/fcgbds.sqlite"
