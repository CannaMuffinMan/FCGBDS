# Forward auth to your own FCGBDS. Replace hostnames with yours.
# auth_request only treats 401 and 403 as denials, so the instance is called with
# X-FCGBDS-Nginx: 1 and maps a visitor check to 401 plus a JSON explanation.
# A 429 is not returned empty.

upstream fcgbds {
  server 127.0.0.1:3001;
}

server {
  listen 80;
  server_name app.example;

  location / {
    auth_request /_fcgbds;
    auth_request_set $fcgbds_decision $upstream_http_x_fcgbds_decision;
    auth_request_set $fcgbds_score $upstream_http_x_fcgbds_score;
    error_page 401 403 = @fcgbds_explain;
    proxy_pass http://127.0.0.1:8080;
  }

  location = /_fcgbds {
    internal;
    proxy_pass http://fcgbds/v1/forward-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-FCGBDS-Nginx 1;
    proxy_set_header Authorization "Bearer replace-with-your-token";
  }

  location @fcgbds_explain {
    internal;
    default_type application/json;
    add_header X-FCGBDS-Decision $fcgbds_decision always;
    add_header X-FCGBDS-Score $fcgbds_score always;
    return 403 '{"error":"request_blocked_or_challenge","message":"The site operator FCGBDS instance denied this request.","decision":"$fcgbds_decision","score":"$fcgbds_score"}';
  }
}
